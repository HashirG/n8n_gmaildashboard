<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desk — Mail Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:          #a480e0;
    --ink-hover:    #b89aea;

    --paper:        #0a0b0d;
    --paper-card:   #16181c;
    --paper-line:   #2a2e34;
    --paper-line-2: #1e2126;

    --text:         #eceef1;
    --text-dim:     #9aa3ad;
    --text-faint:   #666f79;
    --heading:      #d7d3cb;

    --stamp:        #ff5f45;
    --stamp-dim:    #ff5f4526;
    --brass:        #f0b52c;
    --brass-dim:    #f0b52c26;
    --teal:         #2fbf8a;
    --teal-dim:     #2fbf8a26;

    --serif: 'Fraunces', Georgia, serif;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  }

  *{ box-sizing:border-box; }
  html{ -webkit-font-smoothing:antialiased; }
  html, body{ height:100%; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--text);
    font-family:var(--sans);
    font-size:13.5px;
    line-height:1.5;
  }
  body[data-view="dashboard"]{ overflow:hidden; }
  ::selection{ background:var(--brass-dim); color:var(--text); }
  a{ color:inherit; }
  button{ font-family:inherit; }
  svg{ display:block; }
  :focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }

  /* ================= layout ================= */
  .page{
    max-width:1180px;
    margin:0 auto;
    padding:24px 32px 32px;
    width:100%;
  }
  body[data-view="dashboard"] .page{
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:20px 32px 18px;
  }

  .page-header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:16px;
    flex-wrap:wrap;
    flex:0 0 auto;
  }
  .page-header h1{
    font-family:var(--serif);
    font-weight:500;
    font-size:23px;
    margin:0 0 4px;
    color:var(--heading);
  }
  .page-header .sub{ color:var(--text-dim); font-size:12px; }
  .page-actions{ display:flex; gap:10px; }

  .btn{
    font-size:12.5px;
    font-weight:500;
    padding:9px 15px;
    border-radius:7px;
    border:1px solid var(--paper-line);
    background:var(--paper-card);
    color:var(--text);
    cursor:pointer;
    display:inline-flex; align-items:center; gap:7px;
    transition:background 120ms ease, border-color 120ms ease, transform 80ms ease;
  }
  .btn:hover{ border-color:var(--text-faint); }
  .btn:active{ transform:translateY(1px); }
  .btn.primary{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .btn.primary:hover{ background:var(--ink-hover); border-color:var(--ink-hover); }
  .btn.small{ padding:6px 11px; font-size:11.5px; }
  .btn[disabled]{ opacity:0.5; cursor:default; }

  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--text-dim); font-size:13px;
    background:none; border:none; cursor:pointer; padding:0;
    margin-bottom:18px;
  }
  .back-link:hover{ color:var(--text); }

  /* ---------- card shell used everywhere ---------- */
  .card{
    background:var(--paper-card);
    border:1px solid var(--paper-line);
    border-radius:12px;
  }

  /* ---------- stat cards ---------- */
  .stats-row{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
    margin-bottom:16px;
    flex:0 0 auto;
  }
  .stat-card{
    padding:20px 22px 18px;
    cursor:pointer;
    text-align:left;
    position:relative;
    overflow:hidden;
  }
  .stat-card::before{
    content:"";
    position:absolute;
    top:0; left:0; bottom:0;
    width:4px;
    background:var(--tone,var(--text-faint));
  }
  .stat-label{
    font-size:12px; color:var(--text-dim);
    display:flex; align-items:center; justify-content:space-between;
  }
  .stat-num{
    font-family:var(--serif);
    font-size:34px;
    font-weight:500;
    margin:6px 0 3px;
    color:var(--tone,var(--text));
  }
  .stat-foot{ font-size:11.5px; color:var(--text-faint); }

  /* ---------- grid rows ---------- */
  .panel{ padding:20px 24px 24px; }
  .panel-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:16px;
    gap:10px;
    flex:0 0 auto;
  }
  .panel-title{ font-family:var(--serif); font-size:15px; font-weight:500; color:var(--heading); }
  .panel-note{ font-size:11.5px; color:var(--text-faint); }

  /* category cards */
  .cat-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(158px, 1fr));
    align-content:center;
    gap:14px;
    flex:1 1 auto;
  }
  .cat-card{
    border:1px solid var(--paper-line);
    border-radius:10px;
    padding:18px 18px 16px;
    background:var(--paper-card);
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    color:inherit;
    transition:border-color 120ms ease, background 120ms ease, transform 80ms ease;
  }
  .cat-card:hover{ border-color:var(--teal); background:var(--teal-dim); }
  .cat-card:active{ transform:translateY(1px); }
  .cat-card-name{
    font-size:12px;
    color:var(--text-dim);
    line-height:1.35;
    margin-bottom:12px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .cat-card-count{ font-family:var(--serif); font-size:27px; font-weight:500; color:var(--teal); }

  .tag{
    font-size:9.5px; font-weight:600; letter-spacing:0.02em;
    padding:2px 6px; border-radius:4px;
  }
  .tag.urgent{ background:var(--stamp-dim); color:var(--stamp); }
  .tag.important{ background:var(--brass-dim); color:var(--brass); }

  /* email list (recent / category / attention / all / tasks) */
  .email-list{ display:flex; flex-direction:column; }
  .email-row{
    display:grid;
    grid-template-columns:150px 1fr auto;
    gap:18px;
    align-items:start;
    padding:10px 6px;
    border-bottom:1px solid var(--paper-line-2);
    cursor:pointer;
    border-radius:6px;
    transition:background 120ms ease;
  }
  .email-row:hover{ background:var(--paper-line-2); }
  .email-sender-col{ min-width:0; }
  .email-sender{ font-weight:500; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .email-flags{ display:flex; gap:6px; margin-top:4px; }
  .email-body-col{ min-width:0; }
  .email-subject{ font-family:var(--serif); font-size:14.5px; margin:0 0 3px; }
  .email-summary{
    font-style:italic; color:var(--text-dim); font-size:12.5px; line-height:1.45;
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;
  }
  .email-meta-col{ text-align:right; white-space:nowrap; padding-top:1px; }
  .email-time{ font-size:11.5px; color:var(--text-faint); }
  .email-category{ display:block; font-size:10.5px; color:var(--text-faint); margin-top:5px; }

  /* ---------- dashboard: fit to one screen ---------- */
  body[data-view="dashboard"] .page > section.panel{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  .empty-state{ padding:44px 6px; color:var(--text-faint); font-size:13.5px; text-align:center; }

  /* ---------- detail ---------- */
  .detail{ max-width:680px; }
  .detail-header{ padding-bottom:20px; border-bottom:1px solid var(--paper-line); margin-bottom:24px; }
  .detail-subject{ font-family:var(--serif); font-size:25px; font-weight:500; margin:0 0 16px; line-height:1.3; }
  .detail-meta{ display:flex; flex-direction:column; gap:5px; font-size:13px; color:var(--text-dim); }
  .detail-meta .row{ display:flex; gap:8px; }
  .detail-meta .k{ color:var(--text-faint); width:78px; flex-shrink:0; }
  .detail-flags{ display:flex; gap:8px; margin-top:14px; }
  .detail-body{ font-size:14.5px; line-height:1.8; color:var(--text); white-space:pre-line; }
  .attachments{ margin-top:28px; padding-top:20px; border-top:1px solid var(--paper-line); }
  .section-title{ font-size:12px; color:var(--text-faint); margin-bottom:10px; font-weight:500; }
  .attachment-chip{
    display:inline-flex; align-items:center; gap:8px; padding:7px 12px;
    border:1px solid var(--paper-line); border-radius:6px; font-size:12.5px;
    color:var(--text-dim); margin-right:8px; margin-bottom:8px; background:var(--paper);
  }
  .detail-actions{ margin-top:32px; padding-top:20px; border-top:1px solid var(--paper-line); display:flex; gap:10px; }

  .toast{
    position:fixed; bottom:24px; left:50%;
    transform:translateX(-50%) translateY(0);
    background:var(--ink); color:#fff;
    padding:11px 18px; border-radius:8px; font-size:13px;
    opacity:0; pointer-events:none;
    transition:opacity 180ms ease, transform 180ms ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  @media (max-width: 980px){
    .stats-row{ grid-template-columns:repeat(2,1fr); }
  }
  @media (max-width: 720px){
    .page{ padding:18px 16px 32px; }
    body[data-view="dashboard"] .page{ height:auto; display:block; }
    body[data-view="dashboard"]{ overflow:auto; }
    body[data-view="dashboard"] .page > section.panel{ display:block; }
    .stats-row{ grid-template-columns:1fr 1fr; }
    .email-row{ grid-template-columns:1fr; }
    .email-meta-col{ text-align:left; display:flex; gap:10px; align-items:center; }
    .email-category{ margin-top:0; }
  }
</style>
</head>
<body>

<main class="page" id="page"><!-- filled by JS --></main>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ICONS (inline, line-style)
========================================================= */
const ICONS = {
  refresh: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 4v6h-6"/></svg>`,
  plus: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  check: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m8 12 3 3 6-6"/></svg>`,
  arrow: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>`,
};

/* =========================================================
   MOCK DATA — swap loadEmails() for a fetch() to your n8n
   webhook and keep this exact object shape.
========================================================= */

const CATEGORIES = [
  "Assignments Due", "Due Tomorrow", "Events", "Files",
  "Internship/Job Opportunities", "New Course Material",
  "Random FYP Showings", "SaaS Promotions/Updates/Newsletters",
  "Others", "University Information"
];



async function loadEmails() {
  const response = await fetch("http://localhost:5678/webhook/email-dashboard");
  const emails = await response.json();

  return emails.map(email => ({
    id: email.id,
    sender: email.sender_name,
    senderEmail: email.sender_email,
    recipient: email.recipient || "",
    subject: email.subject,

    // First non-special category becomes the main category
    category:
      email.category?.find(
        c => c !== "Urgent" && c !== "Important"
      ) || "Others",

    // Check the category array for these flags
    urgent: email.category?.includes("Urgent") || false,
    important: email.category?.includes("Important Emails") || false,

    // Database timestamp → frontend date
    date: email.received_at,

    summary: email.summary,

    // Your current DB output doesn't contain the email body yet
    body: email.body || "",

    // Database attachment_filenames → frontend attachments
    attachments: email.attachment_filenames || []
  }));
}

/* =========================================================
   STATE
========================================================= */
let EMAILS = [];
let view = { type: "dashboard" }; // dashboard | all | category | attention | tasks | detail
const tasks = new Set();

const pageEl = document.getElementById("page");
const toastEl = document.getElementById("toast");

/* =========================================================
   HELPERS
========================================================= */
function escapeHtml(str){
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function formatTime(iso){
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function formatFullDate(iso){
  return new Date(iso).toLocaleString(undefined,{weekday:"long",month:"long",day:"numeric",hour:"numeric",minute:"2-digit"});
}
function flaggedEmails(){
  return EMAILS.filter(e => e.urgent || e.important);
}
function counts(){
  const urgent = EMAILS.filter(e => e.urgent).length;
  const important = EMAILS.filter(e => e.important).length;
  const byCategory = {};
  CATEGORIES.forEach(c => byCategory[c] = 0);
  EMAILS.forEach(e => { byCategory[e.category] = (byCategory[e.category]||0)+1; });
  return { urgent, important, byCategory };
}
function goto(v){ view = v; render(); }

/* =========================================================
   DASHBOARD
========================================================= */
function renderDashboard(){
  const { urgent, important, byCategory } = counts();
  const today = new Date(EMAILS.reduce((m,e)=>Math.max(m,new Date(e.date).getTime()),0) || Date.now())
    .toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});

  const sortedCats = CATEGORIES.map(c => ({ name:c, count: byCategory[c]||0 }))
    .filter(c => c.count > 0)
    .sort((a,b) => b.count - a.count);

  pageEl.innerHTML = `
    <div class="page-header">
      <div>
        <h1>Inbox</h1>
        <div class="sub">${today} · mail synced from Gmail via n8n</div>
      </div>
    </div>

    <div class="stats-row">
      <button class="stat-card card" id="statUrgent" style="--tone:var(--stamp)">
        <div class="stat-label">Urgent</div>
        <div class="stat-num">${urgent}</div>
        <div class="stat-foot">needs an immediate reply</div>
      </button>
      <button class="stat-card card" id="statImportant" style="--tone:var(--brass)">
        <div class="stat-label">Important</div>
        <div class="stat-num">${important}</div>
        <div class="stat-foot">worth your attention</div>
      </button>
    </div>

    <section class="card panel">
      <div class="panel-head">
        <span class="panel-title">Mail by category</span>
        <span class="panel-note">${sortedCats.length} active</span>
      </div>
      <div class="cat-grid">
        ${sortedCats.map(c => `
          <button class="cat-card" data-cat="${escapeHtml(c.name)}">
            <div class="cat-card-name">${escapeHtml(c.name)}</div>
            <div class="cat-card-count">${c.count}</div>
          </button>
        `).join("")}
      </div>
    </section>
  `;

  document.getElementById("statUrgent").addEventListener("click", () => goto({ type:"attention", filter:"urgent" }));
  document.getElementById("statImportant").addEventListener("click", () => goto({ type:"attention", filter:"important" }));

  pageEl.querySelectorAll(".cat-card").forEach(btn => {
    btn.addEventListener("click", () => goto({ type:"category", category: btn.dataset.cat }));
  });
}

/* =========================================================
   SHARED EMAIL LIST
========================================================= */
function emailRow(email){
  const flags = [];
  if (email.urgent) flags.push(`<span class="tag urgent">Urgent</span>`);
  if (email.important) flags.push(`<span class="tag important">Important</span>`);
  return `
    <div class="email-row" data-id="${email.id}" tabindex="0" role="button">
      <div class="email-sender-col">
        <div class="email-sender">${escapeHtml(email.sender)}</div>
        <div class="email-flags">${flags.join("")}</div>
      </div>
      <div class="email-body-col">
        <p class="email-subject">${escapeHtml(email.subject)}</p>
        <p class="email-summary">${escapeHtml(email.summary)}</p>
      </div>
      <div class="email-meta-col">
        <span class="email-time">${formatTime(email.date)}</span>
        <span class="email-category">${escapeHtml(email.category)}</span>
      </div>
    </div>
  `;
}
function renderEmailList(emails){
  if (!emails || emails.length === 0) return `<div class="empty-state">Nothing here yet.</div>`;
  return `<div class="email-list">${emails.map(emailRow).join("")}</div>`;
}
function bindEmailRows(){
  pageEl.querySelectorAll(".email-row").forEach(row => {
    const open = () => goto({ type:"detail", id: row.dataset.id, from: view });
    row.addEventListener("click", open);
    row.addEventListener("keydown", (e) => { if (e.key === "Enter") open(); });
  });
}

/* =========================================================
   OTHER PAGES
========================================================= */
function renderAll(){
  const emails = [...EMAILS].sort((a,b)=> new Date(b.date)-new Date(a.date));
  pageEl.innerHTML = `
    <button class="back-link">${ICONS.arrow} Dashboard</button>
    <div class="page-header"><div><h1>All mail</h1><div class="sub">${emails.length} messages</div></div></div>
    <div class="card panel">${renderEmailList(emails)}</div>
  `;
  pageEl.querySelector(".back-link").addEventListener("click", () => goto({ type:"dashboard" }));
  bindEmailRows();
}

function renderCategory(){
  const emails = EMAILS.filter(e => e.category === view.category).sort((a,b)=> new Date(b.date)-new Date(a.date));
  const { byCategory } = counts();
  const sortedCats = CATEGORIES.filter(c => byCategory[c] > 0);
  pageEl.innerHTML = `
    <button class="back-link">${ICONS.arrow} Dashboard</button>
    <div class="page-header"><div><h1>${escapeHtml(view.category)}</h1><div class="sub">${emails.length} email${emails.length===1?"":"s"}</div></div></div>
    <div class="cat-list" style="margin-bottom:22px; display:flex; flex-wrap:wrap; gap:8px;">
      ${sortedCats.map(c => `<button class="btn small ${c===view.category?'primary':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)} · ${byCategory[c]}</button>`).join("")}
    </div>
    <div class="card panel">${renderEmailList(emails)}</div>
  `;
  pageEl.querySelector(".back-link").addEventListener("click", () => goto({ type:"dashboard" }));
  pageEl.querySelectorAll("[data-cat]").forEach(btn => {
    btn.addEventListener("click", () => goto({ type:"category", category: btn.dataset.cat }));
  });
  bindEmailRows();
}

function renderAttention(){
  const label = view.filter === "urgent" ? "Urgent" : "Important";
  const emails = EMAILS.filter(e => view.filter === "urgent" ? e.urgent : e.important)
    .sort((a,b)=> new Date(b.date)-new Date(a.date));
  pageEl.innerHTML = `
    <button class="back-link">${ICONS.arrow} Dashboard</button>
    <div class="page-header">
      <div><h1>${label}</h1><div class="sub">${emails.length} email${emails.length===1?"":"s"}</div></div>
      <div class="page-actions">
        <button class="btn small ${view.filter==='urgent'?'primary':''}" data-f="urgent">Urgent</button>
        <button class="btn small ${view.filter==='important'?'primary':''}" data-f="important">Important</button>
      </div>
    </div>
    <div class="card panel">${renderEmailList(emails)}</div>
  `;
  pageEl.querySelector(".back-link").addEventListener("click", () => goto({ type:"dashboard" }));
  pageEl.querySelectorAll("[data-f]").forEach(btn => {
    btn.addEventListener("click", () => goto({ type:"attention", filter: btn.dataset.f }));
  });
  bindEmailRows();
}

function renderTasks(){
  const emails = EMAILS.filter(e => tasks.has(e.id)).sort((a,b)=> new Date(b.date)-new Date(a.date));
  pageEl.innerHTML = `
    <button class="back-link">${ICONS.arrow} Dashboard</button>
    <div class="page-header"><div><h1>Tasks</h1><div class="sub">${emails.length} email${emails.length===1?"":"s"} added from your inbox</div></div></div>
    <div class="card panel">${emails.length ? renderEmailList(emails) : `<div class="empty-state">No tasks yet — add flagged mail from the dashboard or an email's detail view.</div>`}</div>
  `;
  pageEl.querySelector(".back-link").addEventListener("click", () => goto({ type:"dashboard" }));
  bindEmailRows();
}

function renderDetail(){
  const email = EMAILS.find(e => e.id === view.id);
  if (!email){ view = { type:"dashboard" }; return render(); }
  const flags = [];
  if (email.urgent) flags.push(`<span class="tag urgent">Urgent</span>`);
  if (email.important) flags.push(`<span class="tag important">Important</span>`);
  const added = tasks.has(email.id);

  pageEl.innerHTML = `
    <button class="back-link">${ICONS.arrow} Back</button>
    <article class="detail">
      <div class="detail-header">
        <h2 class="detail-subject">${escapeHtml(email.subject)}</h2>
        <div class="detail-meta">
          <div class="row"><span class="k">From</span><span>${escapeHtml(email.sender)} &lt;${escapeHtml(email.senderEmail)}&gt;</span></div>
          <div class="row"><span class="k">To</span><span>${escapeHtml(email.recipient)}</span></div>
          <div class="row"><span class="k">Date</span><span>${formatFullDate(email.date)}</span></div>
          <div class="row"><span class="k">Category</span><span>${escapeHtml(email.category)}</span></div>
        </div>
        ${flags.length ? `<div class="detail-flags">${flags.join("")}</div>` : ""}
      </div>

      <div class="detail-body">${escapeHtml(email.body)}</div>

      ${email.attachments && email.attachments.length ? `
        <div class="attachments">
          <div class="section-title">Attachments</div>
          ${email.attachments.map(a => `<span class="attachment-chip">${escapeHtml(a)}</span>`).join("")}
        </div>` : ""}

      <div class="detail-actions">
        <button class="btn primary" id="taskToggle">${added ? "Remove from tasks" : "Add to tasks"}</button>
      </div>
    </article>
  `;

  pageEl.querySelector(".back-link").addEventListener("click", () => goto(view.from || { type:"dashboard" }));
  document.getElementById("taskToggle").addEventListener("click", () => {
    if (tasks.has(email.id)){ tasks.delete(email.id); showToast(`Removed "${email.subject}" from tasks`); }
    else { tasks.add(email.id); showToast(`Added "${email.subject}" to tasks`); }
    render();
  });
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2200);
}

/* =========================================================
   ROOT RENDER
========================================================= */
function render(){
  document.body.dataset.view = view.type === "dashboard" ? "dashboard" : "default";
  if (view.type === "dashboard") renderDashboard();
  else if (view.type === "all") renderAll();
  else if (view.type === "category") renderCategory();
  else if (view.type === "attention") renderAttention();
  else if (view.type === "tasks") renderTasks();
  else if (view.type === "detail") renderDetail();
}

loadEmails().then(data => { EMAILS = data; render(); });
</script>
</body>
</html>
